name: Trivy Dependency Scan

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect dependency manifests
        id: detect
        shell: bash
        run: |
          echo "Searching for supported dependency manifests..."

          find . -type f \( \
            -name "pom.xml" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "package.json" \
            -o -name "package-lock.json" \
            -o -name "yarn.lock" \
            -o -name "pnpm-lock.yaml" \
            -o -name "requirements.txt" \
            -o -name "poetry.lock" \
            -o -name "Pipfile.lock" \
            -o -name "go.mod" \
            -o -name "Cargo.toml" \
            -o -name "composer.lock" \
            -o -name "Gemfile.lock" \
            -o -name "*.csproj" \
          \) | tee dependency-files.txt

          if [ ! -s dependency-files.txt ]; then
            echo "No supported dependency manifests found."
            exit 1
          fi

          echo "Detected dependency manifests:"
          cat dependency-files.txt

      - name: Run Trivy Scan (Table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          output: trivy-report.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Run Trivy Scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Run Trivy Scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-report.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

