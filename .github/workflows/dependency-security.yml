name: Trivy Dependency Scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ####################################################
      # Java Projects
      ####################################################

      - name: Set up Java
        if: hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve Maven dependencies
        if: hashFiles('**/pom.xml') != ''
        run: mvn -B dependency:go-offline

      - name: Resolve Gradle dependencies
        if: hashFiles('**/gradlew') != ''
        run: |
          chmod +x gradlew
          ./gradlew dependencies

      ####################################################
      # Node Projects
      ####################################################

      - name: Set up Node.js
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        if: hashFiles('**/package-lock.json') != ''
        run: npm ci

      - name: Install Yarn dependencies
        if: hashFiles('**/yarn.lock') != ''
        run: |
          corepack enable
          yarn install --immutable

      - name: Install pnpm dependencies
        if: hashFiles('**/pnpm-lock.yaml') != ''
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      ####################################################
      # Trivy Scans
      ####################################################

      - name: Trivy Scan (Table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          
      - name: Display Trivy Report
        run: |
          echo "===== Trivy Dependency Report ====="
          cat trivy-report.txt
          
      - name: Send Trivy Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: khoseshivani@gmail.com
          password: jazw zfie mlql crea
          secure: true

          subject: |
            Trivy Scan Report - ${{ github.repository }}

          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions

          body: |
            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit     : ${{ github.sha }}

            Trivy dependency scan has completed.

            Please find the attached reports.

          attachments: |
            trivy-report.txt
